<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한식 웹페이지</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f5f5f5;
            height: 100vh;
            justify-content: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        #location-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        #map {
            width: 100%;
            height: 50vh; /* 지도는 화면의 절반을 차지하도록 설정 */
            background-color: #e0e0e0; /* 임시 배경으로 색상 설정 */
        }

        .location-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 10px;
        }

        .location {
            padding: 15px;
            margin: 10px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 80%;
            max-width: 500px;
            text-align: left;
        }

        .location h3 {
            margin: 0;
            font-size: 18px;
        }

        .location p {
            margin: 5px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>한식 웹페이지</h1>

    <!-- 위치 및 음식점 리스트가 표시될 영역 -->
    <div id="location-container">
        <div id="map">
            <!-- 임시로 지도에 해당하는 영역은 회색으로 표시 -->
            <p style="text-align:center; padding-top: 20px;">지도 영역 (GPS 활성화 후 여기에 지도가 표시됩니다)</p>
        </div>
        
        <div id="location-list" class="location-list">
            <!-- 음식점 리스트가 여기에 동적으로 추가됩니다. -->
        </div>
    </div>

    <script>
        // 페이지가 로드되면 바로 실행
        window.onload = function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    // 위치가 확인되면 새로운 영역을 보여줍니다.
                    document.getElementById('location-container').style.display = 'flex';

                    // 지도 영역에 실제로 지도를 표시하고자 한다면,
                    // 구글 지도 API나 다른 지도 API를 사용할 수 있습니다.
                    // 예시로 임시로 지도 영역을 회색으로 표시.

                    // 음식점 리스트를 생성하는 함수
                    const restaurants = [
                        { name: "맛집 1", address: "서울 강남구", lat: lat + 0.01, lon: lon + 0.01 },
                        { name: "맛집 2", address: "서울 종로구", lat: lat + 0.02, lon: lon + 0.02 },
                        { name: "맛집 3", address: "서울 마포구", lat: lat + 0.03, lon: lon + 0.03 },
                    ];

                    const locationList = document.getElementById("location-list");
                    locationList.innerHTML = ''; // 기존 음식점 목록 비우기

                    restaurants.forEach(function(restaurant) {
                        const restaurantElement = document.createElement("div");
                        restaurantElement.classList.add("location");
                        restaurantElement.innerHTML = `
                            <h3>${restaurant.name}</h3>
                            <p>${restaurant.address}</p>
                            <p>위치: ${restaurant.lat}, ${restaurant.lon}</p>
                        `;
                        locationList.appendChild(restaurantElement);
                    });
                }, function(error) {
                    alert("위치 정보를 가져올 수 없습니다.");
                });
            } else {
                alert("이 브라우저는 위치 서비스를 지원하지 않습니다.");
            }
        }
    </script>
</body>
</html>
