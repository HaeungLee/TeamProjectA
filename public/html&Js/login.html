<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="../css/login.css">
    <title>로그인</title>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>레시피를 부탁해</h1>
            <p>맛있는 시간이 시작됩니다</p>
        </div>
        <form class="login-form" action="login_process.php" method="post">
            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" placeholder="이메일을 입력해주세요" required>
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력해주세요" required>
            </div>
            <div class="remember-forgot">
                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">로그인 상태 유지</label>
                </div>
                <div class="forgot-password">
                    <a href="find_password.html">비밀번호 찾기</a>
                </div>
            </div>
            <button type="submit" class="login-button">로그인</button>
        </form>
        <div class="social-login">
            <h3>간편 로그인</h3>
            <div class="social-buttons">
                <div class="social-button" onclick="kakaoLogin()">K</div>
                <div class="social-button" onclick="naverLogin()">N</div>
                <div class="social-button" onclick="googleLogin()">G</div>
            </div>
        </div>
        <div class="signup-link">
            아직 회원이 아니신가요? <a href="signup.html">회원가입</a>
        </div>
    </div>

    <script>
        function kakaoLogin() {
            // 카카오 로그인 기능 구현
            alert("카카오 로그인 기능은 아직 준비 중입니다.");
        }

        function naverLogin() {
            // 네이버 로그인 기능 구현
            alert("네이버 로그인 기능은 아직 준비 중입니다.");
        }

        function googleLogin() {
            // 구글 로그인 기능 구현
            alert("구글 로그인 기능은 아직 준비 중입니다.");
        }
    </script>
</body>
</html>
